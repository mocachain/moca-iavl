run:
  tests: true
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 5m

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gofumpt
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - stylecheck
    - typecheck
    - unconvert
    - unparam
    - unused

linters-settings:
  nolintlint:
    allow-leading-space: true
    require-explanation: false
    require-specific: true

issues:
  exclude-rules:
    - path: "compress.go"
      text: "G115:"
      linters:
        - gosec
    - path: "mutable_tree.go"
      text: "G115:"
      linters:
        - gosec
    - path: "node.go"
      text: "G115:"
      linters:
        - gosec
    - path: "internal/rand/random.go"
      text: "G115:"
      linters:
        - gosec
    - path: "keyformat/key_format.go"
      text: "G115:"
      linters:
        - gosec
    - path: "keyformat/prefix_formatter.go"
      text: "G115:"
      linters:
        - gosec
    - path: "basic_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "diff_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "import_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "internal/encoding/encoding_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "mutable_tree_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "node_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "nodedb_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "tree_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "keyformat/key_format_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "benchmarks/bench_test.go"
      text: "G115:"
      linters:
        - gosec
    - path: "benchmarks/cosmos-exim/main.go"
      text: "G115:"
      linters:
        - gosec
    - path: "benchmarks/hash_test.go"
      text: "G507:"
      linters:
        - gosec
    - text: "Use of weak random number generator"
      linters:
        - gosec
    - text: "comment on exported var"
      linters:
        - golint
    - text: "don't use an underscore in package name"
      linters:
        - golint
    - text: "should be written without leading space as"
      linters:
        - nolintlint
    - text: "ST1003:"
      linters:
        - stylecheck
    # FIXME: Disabled until golangci-lint updates stylecheck with this fix:
    # https://github.com/dominikh/go-tools/issues/389
    - text: "ST1016:"
      linters:
        - stylecheck
    - path: "migrations"
      text: "SA1019:"
      linters:
        - staticcheck

  max-issues-per-linter: 10000
  max-same-issues: 10000
